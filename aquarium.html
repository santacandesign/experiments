<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0C2431" />
<title>Fish Friends — the tank</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="tank"></div>

<div class="hud">
  <span class="brand">fish friends</span>
  <div class="hud-actions">
    <button class="btn small icon ghost" id="fatBtn" title="Overfeed to fat">🍔 fat</button>
    <button class="btn small icon ghost" id="seaweedBtn" title="Stuck in seaweed">🌿 stuck</button>
    <button class="btn small icon ghost" id="deathBtn" title="Simulate death">💀 death</button>
    <button class="btn small icon ghost" id="dayNightBtn" title="Toggle day / night">☀️ day</button>
    <button class="btn small" id="newFish">＋ new fish</button>
  </div>
</div>

<div class="hint" id="hint">tap your fish</div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/creatures.js"></script>
<script src="js/faceparts.js"></script>
<script src="js/samples.js"></script>
<script src="js/voice.js"></script>
<script src="js/aquarium.js"></script>
</body>
</html>
